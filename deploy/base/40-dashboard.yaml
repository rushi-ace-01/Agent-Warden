apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: agent-warden-system
  labels:
    app.kubernetes.io/name: agent-warden
    app.kubernetes.io/component: dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: agent-warden
    app.kubernetes.io/component: dashboard
rules:
  - apiGroups: ["agent-warden.io"]
    resources: ["agentactionrequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agent-warden.io"]
    resources: ["agentactionrequests/status"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: agent-warden
    app.kubernetes.io/component: dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: agent-warden-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: agent-warden-system
  labels:
    app.kubernetes.io/name: agent-warden
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-warden
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: agent-warden/dashboard:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: agent-warden-system
  labels:
    app.kubernetes.io/name: agent-warden
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
