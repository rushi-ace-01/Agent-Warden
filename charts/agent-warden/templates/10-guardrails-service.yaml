{{- if .Values.guardrailsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrails-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "agent-warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardrails-service
spec:
  replicas: {{ .Values.guardrailsService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: guardrails-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "agent-warden.labels" . | nindent 8 }}
        app.kubernetes.io/component: guardrails-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "agent-warden.podSecurityContext" . | nindent 8 }}
      containers:
        - name: guardrails-service
          image: {{ include "agent-warden.image" (dict "root" . "component" .Values.guardrailsService) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          resources:
            {{- toYaml .Values.guardrailsService.resources | nindent 12 }}
          securityContext:
            {{- include "agent-warden.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: guardrails-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "agent-warden.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardrails-service
  {{- if .Values.prometheus.scrape }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "80"
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: guardrails-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
