apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-operator
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: agent-warden
    app.kubernetes.io/component: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-operator
  labels:
    app.kubernetes.io/name: agent-warden
    app.kubernetes.io/component: operator
rules:
  # The CRDs we own - full lifecycle plus status subresource
  - apiGroups: ["agent-warden.io"]
    resources: ["scopedagents", "agentactionrequests"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["agent-warden.io"]
    resources: ["scopedagents/status", "agentactionrequests/status"]
    verbs: ["patch", "update"]
  # Materialized resources - we create and watch these
  - apiGroups: [""]
    resources: ["serviceaccounts", "events"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # kopf housekeeping - peering for leader election
  - apiGroups: ["zalando.org"]
    resources: ["clusterkopfpeerings"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-operator
  labels:
    app.kubernetes.io/name: agent-warden
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-operator
subjects:
  - kind: ServiceAccount
    name: agent-operator
    namespace: {{ .Values.namespace.name }}
