apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-operator
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: agent-warden
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-warden
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: agent-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "agent-warden.image" (dict "root" $ "component" .Values.operator) }}
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
