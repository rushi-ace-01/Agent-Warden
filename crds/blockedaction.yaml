apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: blockedactions.agent-warden.io
spec:
  group: agent-warden.io
  scope: Namespaced
  names:
    plural: blockedactions
    singular: blockedaction
    kind: BlockedAction
    shortNames:
      - ba
    categories:
      - agent-warden
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [agentName, verb, resource, target, scores, reasons, blockedAt]
              properties:
                agentName:
                  type: string
                  description: ScopedAgent that attempted the action.
                verb:
                  type: string
                resource:
                  type: string
                target:
                  type: string
                namespace:
                  type: string
                scores:
                  type: object
                  required: [irreversibility, blastRadius]
                  properties:
                    irreversibility:
                      type: integer
                      minimum: 0
                      maximum: 10
                    blastRadius:
                      type: integer
                      minimum: 0
                      maximum: 100
                    colocationRisk:
                      type: boolean
                    overPermissioned:
                      type: boolean
                reasons:
                  type: array
                  items:
                    type: string
                blockedAt:
                  type: string
                  format: date-time
                requestUid:
                  type: string
                  description: AdmissionReview request UID, useful for log correlation.
      additionalPrinterColumns:
        - name: Agent
          type: string
          jsonPath: .spec.agentName
        - name: Action
          type: string
          jsonPath: .spec.verb
        - name: Resource
          type: string
          jsonPath: .spec.resource
        - name: Target
          type: string
          jsonPath: .spec.target
          priority: 1
        - name: Irr
          type: integer
          jsonPath: .spec.scores.irreversibility
        - name: Blast
          type: integer
          jsonPath: .spec.scores.blastRadius
        - name: BlockedAt
          type: date
          jsonPath: .spec.blockedAt
