name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[guardrails-service,operator,admission-webhook,dashboard,dev]"

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check . 

      - name: Mypy
        run: mypy guardrails_service agent_operator admission_webhook/app dashboard/app

      - name: Pytest
        run: pytest --cov=guardrails_service --cov=agent_operator --cov=admission_webhook --cov-report=term-missing
