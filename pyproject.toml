[project]
name = "agent-warden"
version = "0.1.0"
description = "Runtime guardrails for AI agents on Kubernetes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "guardrails_service",
  "guardrails_service.app",
  "guardrails_service.app.policy",
  "agent_operator",
  "agent_operator.scoped_agent",
  "admission_webhook",
  "admission_webhook.app",
  "dashboard",
  "dashboard.app",
]

[project.optional-dependencies]
guardrails-service = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "prometheus-client>=0.21",
]
operator = [
  "kopf>=1.37",
  "kubernetes>=31.0",
  "pydantic>=2.9",
  "httpx>=0.27",
]
admission-webhook = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
]
dashboard = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "kubernetes>=31.0",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "cryptography>=43.0",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "guardrails_service/tests",
  "agent_operator/tests",
  "admission_webhook/tests",
  "dashboard/tests",
]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
